repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-secrets
        name: block .env and raw key patterns
        entry: python -c "import sys; sys.exit(1 if any(f.endswith('.env') for f in sys.argv[1:]) else 0)"
        language: system
        files: '(^|/)\.env$'

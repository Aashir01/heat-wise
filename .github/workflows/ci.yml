name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m ruff check src tests eval
      - run: .venv/bin/python -m ruff format --check src tests eval
      - run: .venv/bin/python -m mypy
      # All tests are offline (respx fixtures, mock LLM, fake MCP). No secrets are used in CI.
      - run: .venv/bin/python -m pytest -q
